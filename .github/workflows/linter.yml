name: Linting

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Checkstyle
        # This command will automatically fail the build if style issues are found
        # because of the <failsOnError>true</failsOnError> config in the pom.xml
        run: mvn checkstyle:check
