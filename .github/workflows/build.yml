name: Build and Run CAP Projects

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and Run CAP Projects
      uses: ./.github/actions/build
      with:
        java-version: '21'
        node-version: '18'

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          srv/target/*.jar
          tests/incident-app/srv/target/*.jar
        retention-days: 7
